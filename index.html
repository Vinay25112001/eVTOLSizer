<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>eVTOL Sizing App</title>
    <meta name="description" content="eVTOL aircraft sizing and analysis tool — Wright State University" />
    <meta property="og:title" content="eVTOL Sizer" />
    <meta property="og:description" content="Aerospace design suite for eVTOL sizing, performance, stability, and cost analysis." />
    <meta property="og:type" content="website" />
    <!-- Google Fonts — loaded here so they are not re-fetched on every theme toggle -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- The saved Day/Night choice, painted before the scripts load so a night page does not flash white.
         Same precedence as src/lib/display.js: ?theme= in the address, then the saved choice, then the system. -->
    <script>
      (function () {
        try {
          var p = {}; try { p = JSON.parse(localStorage.getItem("evtol-display") || "{}") || {}; } catch (e) {}
          var q = new URLSearchParams(location.search).get("theme");
          var t = q === "dark" || q === "light" ? q : p.theme;
          var d = t === "dark" || (t !== "light" && (!window.matchMedia || matchMedia("(prefers-color-scheme: dark)").matches));
          var h = document.documentElement;
          h.setAttribute("data-theme", d ? "dark" : "light");
          h.style.colorScheme = d ? "dark" : "light";
          h.style.backgroundColor = d ? "#060A10" : "#EEF2F6";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
